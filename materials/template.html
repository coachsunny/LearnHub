<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>【填入單元名稱】— LearnHub 教材</title>
  <!-- 若放在 materials/分類資料夾/ 下，請使用 ../../css/courseware.css -->
  <link rel="stylesheet" href="../css/courseware.css" />
</head>
<body>
  <header class="lesson-header">
    <div class="lesson-meta">
      <span class="lesson-badge">填入分類名稱</span>
      <span class="lesson-info">難度：入門 · 預計授課：45 分鐘</span>
    </div>
    <h1 class="lesson-title">單元標題：在此輸入您的課程主題</h1>
    <p class="lesson-subtitle">在此輸入一至兩句課程重點摘要說明。</p>
  </header>

  <div class="objectives-box">
    <h3>本節課學習目標</h3>
    <ul>
      <li>學習目標重點一</li>
      <li>學習目標重點二</li>
      <li>學習目標重點三</li>
    </ul>
  </div>

  <section>
    <h2><span class="sec-num">1</span> 第一節標題</h2>
    <p>在此撰寫教材內文段落，行內程式碼可使用 <code>code</code> 標籤包覆。</p>
    <pre><code>// 範例程式碼區塊
function helloLearnHub() {
  console.log("Welcome to LearnHub!");
}</code></pre>
    <div class="callout tip">
      <div class="callout-title">💡 重點提示</div>
      <p style="margin:0">可以在此放置課堂補充提醒或常見問題。</p>
    </div>
  </section>

  <section>
    <h2><span class="sec-num">2</span> 隨堂練習與解答</h2>
    <details class="quiz-item">
      <summary>點擊展開隨堂練習參考解答</summary>
      <div class="quiz-answer">
        <p>在此放置練習題解析。</p>
      </div>
    </details>
  </section>
</body>
</html>
